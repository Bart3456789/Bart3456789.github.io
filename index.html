<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Bart-HUB</title>
    <link rel="icon" type="image/png" href="assets/img/logo/logoTab.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="index" class="d-flex flex-column text-white">
    <header data-vd-nav></header>

    <main>
        <section class="vd-hero">
            <div>
                <p class="vd-tag">// web developer in opleiding</p>
                <h1 class="vd-name">BARTOSZ<span>JAWORSKI</span></h1>
                <p class="vd-lead">Ik bouw <b data-words>websites</b><i class="vd-caret"></i> en alles daartussen.</p>
                <div class="d-flex flex-wrap gap-3">
                    <a class="btn btn-void btn-lg fw-bold" href="projects.html">Bekijk projecten</a>
                    <a class="btn btn-outline-light btn-lg fw-bold" href="#" data-doom>&#9654; Speel DOOM</a>
                </div>
            </div>
            <div class="vd-hole" aria-hidden="true"><span class="vd-ring"></span></div>
        </section>
    </main>

    <footer data-vd-foot></footer>

    <!-- Doom Overlay -->
    <div id="doomOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.92); align-items:center; justify-content:center; flex-direction:column;">
        <div style="position:relative; width:min(900px,96vw); background:#000; border:2px solid rgba(139,92,246,.6); border-radius:8px; box-shadow:0 0 60px rgba(139,92,246,.35); overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:.5rem 1rem; background:rgba(13,23,32,.9); border-bottom:1px solid rgba(255,255,255,.1);">
                <span style="color:#c4b5fd; font-weight:700; font-family:monospace; font-size:.9rem; letter-spacing:.1em;">// DOOM.EXE</span>
                <button onclick="closeDoom()" style="background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer; line-height:1; padding:0 .2rem;" title="Sluiten">&times;</button>
            </div>
            <div style="position:relative; padding-top:62.5%;">
                <iframe id="doomFrame" src="about:blank" allowfullscreen style="position:absolute; inset:0; width:100%; height:100%; border:none;"></iframe>
            </div>
            <div style="padding:.4rem 1rem; background:rgba(13,23,32,.9); font-size:.72rem; color:rgba(255,255,255,.4); font-family:monospace;">
                Tip: klik in het spel om controls te activeren &mdash; ESC sluit dit venster
            </div>
        </div>
    </div>

    <style>@keyframes doom-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}#doomOverlay>div{animation:doom-in .22s ease}</style>

    <script>
        function openDoom() {
            const overlay = document.getElementById('doomOverlay');
            const frame   = document.getElementById('doomFrame');
            frame.src = 'https://silentspacemarine.com/';
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeDoom() {
            const overlay = document.getElementById('doomOverlay');
            const frame   = document.getElementById('doomFrame');
            overlay.style.display = 'none';
            frame.src = 'about:blank';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('doomOverlay').style.display !== 'none') closeDoom();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/void.js"></script>
</body>
</html>
