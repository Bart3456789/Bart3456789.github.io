<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bart-HUB</title>
    <link rel="icon" type="image/png" href="assets/img/logo/logoTab.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="contact" class="d-flex flex-column text-white">
    <header data-vd-nav></header>

    <main class="flex-grow-1">
        <section class="container py-5 my-lg-5">
            <div class="row g-5 align-items-stretch">
                <div class="col-12 col-lg-5">
                    <div class="bg-dark bg-opacity-75 border border-secondary rounded-4 shadow-lg glass p-4 p-md-5 h-100">
                        <p class="text-void fw-bold text-uppercase small mb-2">05 // contact</p>
                        <h1 class="display-2 fw-bold lh-1 mb-3">Let's build.</h1>
                        <p class="lead text-white-50">Voor vragen, projecten of samenwerkingen kun je mij bereiken via mail of GitHub.</p>
                        <div class="list-group rounded-4 overflow-hidden mt-4">
                            <div class="list-group-item list-group-item-dark d-flex align-items-center justify-content-between gap-3 py-3">
                                <a href="mailto:bartekjaworski416@gmail.com" class="link-light text-decoration-none text-break">bartekjaworski416@gmail.com</a>
                                <button type="button" class="btn btn-sm btn-outline-light fw-bold flex-shrink-0" data-copy-email>Kopieer</button>
                            </div>
                            <a href="https://github.com/Bart3456789" target="_blank" rel="noopener" class="list-group-item list-group-item-action list-group-item-dark py-3">github.com/Bart3456789</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-7">
                    <form class="bg-dark bg-opacity-75 border border-secondary rounded-4 shadow-lg glass p-4 p-md-5 h-100" data-contact-form novalidate>
                        <h2 class="h3 fw-bold mb-4">Stuur een bericht</h2>
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="name" class="form-label">Naam</label>
                                <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="name" name="name" placeholder="Jouw naam" autocomplete="name" required>
                                <div class="invalid-feedback">Vul je naam in.</div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control form-control-lg bg-dark text-white border-secondary" id="email" name="email" placeholder="jij@example.com" autocomplete="email" required>
                                <div class="invalid-feedback">Vul een geldig e-mailadres in.</div>
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Bericht</label>
                                <textarea class="form-control bg-dark text-white border-secondary" id="message" name="message" rows="6" minlength="10" maxlength="2000" placeholder="Waar wil je contact over opnemen?" required></textarea>
                                <div class="invalid-feedback">Schrijf een bericht van minimaal 10 tekens.</div>
                            </div>
                            <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="d-none" aria-hidden="true">
                            <div class="col-12 d-flex flex-wrap align-items-center gap-3">
                                <button class="btn btn-void btn-lg fw-bold" type="submit" data-submit-btn>Verstuur bericht</button>
                                <small class="text-white-50" data-form-hint></small>
                            </div>
                            <div class="col-12" data-form-status role="status" aria-live="polite"></div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer data-vd-foot></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/void.js"></script>
</body>
</html>
